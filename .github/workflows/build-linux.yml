name: Build Linux dist

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_MULTILEVEL_LOOKUP: "0"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Linux x86_64 dist
    runs-on: ubuntu-24.04
    container:
      image: debian:13
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Debian 13 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl debian-archive-keyring
          curl --fail --location --silent --show-error \
            https://packages.microsoft.com/config/debian/13/packages-microsoft-prod.deb \
            -o /tmp/packages-microsoft-prod.deb
          dpkg -i /tmp/packages-microsoft-prod.deb
          printf '%s\n' 'deb http://deb.debian.org/debian trixie-backports main' > /etc/apt/sources.list.d/trixie-backports.list
          apt-get update
          apt-get install -y --no-install-recommends -t trixie-backports cmake clang-21
          cmake --version | grep -q '^cmake version 4\.3\.4$'
          clang-21 --version | grep -q 'clang version 21\.'
          apt-get install -y --no-install-recommends \
            build-essential dbus dotnet-sdk-10.0 ffmpeg fontconfig git glslang-tools \
            libasound2-dev libass-dev libavcodec-dev libavformat-dev libavutil-dev \
            libdbus-1-dev libdrm-dev libegl-dev libfontconfig1-dev libfreetype-dev \
            libgles2-mesa-dev libglvnd-dev liblz4-dev libmpv-dev libpipewire-0.3-dev \
            libplacebo-dev libpulse-dev libswresample-dev libswscale-dev libvulkan-dev \
            libx11-dev libxkbcommon-dev ninja-build pkg-config qt6-5compat-dev qt6-base-dev \
            qt6-base-dev-tools qt6-declarative-dev qt6-shadertools-dev qt6-webchannel-dev \
            qt6-webengine-dev qt6-webengine-dev-tools qt6-wayland-dev \
            qml6-module-qt5compat-graphicaleffects qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs qml6-module-qtquick-layouts qml6-module-qtquick-shapes \
            qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtwebengine
          {
            printf 'CC=%s\n' "$(command -v clang-21)"
            printf 'CXX=%s\n' "$(command -v clang++-21)"
            printf 'FFMPEG_BIN=%s\n' "$(command -v ffmpeg)"
          } >> "$GITHUB_ENV"

      - name: Install linuxdeploy tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/linuxdeploy"
          curl --fail --location --silent --show-error \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -o "$RUNNER_TEMP/linuxdeploy/linuxdeploy"
          curl --fail --location --silent --show-error \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            -o "$RUNNER_TEMP/linuxdeploy/linuxdeploy-plugin-qt"
          chmod 755 "$RUNNER_TEMP/linuxdeploy/linuxdeploy" "$RUNNER_TEMP/linuxdeploy/linuxdeploy-plugin-qt"
          printf '%s\n' "$RUNNER_TEMP/linuxdeploy" >> "$GITHUB_PATH"
          printf 'LINUXDEPLOY=%s\n' "$RUNNER_TEMP/linuxdeploy/linuxdeploy" >> "$GITHUB_ENV"
          printf 'LINUXDEPLOY_PLUGIN_QT=%s\n' "$RUNNER_TEMP/linuxdeploy/linuxdeploy-plugin-qt" >> "$GITHUB_ENV"

      - name: Install appimagetool
        shell: bash
        run: |
          set -euo pipefail
          appimagetool="${RUNNER_TEMP}/appimagetool-x86_64.AppImage"
          curl --fail --location --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o "$appimagetool"
          chmod 755 "$appimagetool"
          printf '%s\n' "$(dirname "$appimagetool")" >> "$GITHUB_PATH"
          printf 'APPIMAGETOOL=%s\n' "$appimagetool" >> "$GITHUB_ENV"

      - name: Build and package Linux distribution
        shell: bash
        run: |
          set -euo pipefail
          JOBS="$(nproc)" scripts/build_all_linux.sh release

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MirageWallpaper-linux-x86_64-AppImage
          path: dist/MirageWallpaper-*-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
