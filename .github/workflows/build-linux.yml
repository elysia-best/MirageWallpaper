name: Build Linux AppImage

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux AppImage
    runs-on: ubuntu-24.04
    container:
      image: debian:13
    timeout-minutes: 180
    env:
      CC: clang-22
      CXX: clang++-22
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install Debian 13 build dependencies
        shell: bash
        run: |
          set -euo pipefail

          # Debian 13 supplies Qt 6.8, FFmpeg 7, mpv, Vulkan, and all renderer
          # libraries. Only the compiler and CMake are intentionally sourced
          # outside the base suite: Clang comes from LLVM's Debian repository,
          # while CMake comes from Debian trixie-backports.
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            gnupg \
            nodejs \
            xz-utils

          install -d -m 0755 /etc/apt/keyrings
          curl --fail --location --silent --show-error \
            https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor --output /etc/apt/keyrings/llvm.gpg
          printf '%s\n' \
            'deb [signed-by=/etc/apt/keyrings/llvm.gpg] https://apt.llvm.org/trixie/ llvm-toolchain-trixie-22 main' \
            > /etc/apt/sources.list.d/llvm.list
          printf '%s\n' \
            'deb https://deb.debian.org/debian trixie-backports main' \
            > /etc/apt/sources.list.d/trixie-backports.list

          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            clang-22 \
            desktop-file-utils \
            file \
            glslang-tools \
            lld-22 \
            libasound2-dev \
            libass-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libdbus-1-dev \
            libdrm-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libgssapi-krb5-2 \
            libglfw3-dev \
            libglvnd-dev \
            libicu76 \
            liblz4-dev \
            libmpv-dev \
            libpipewire-0.3-dev \
            libplacebo-dev \
            libpulse-dev \
            libssl3t64 \
            libswresample-dev \
            libswscale-dev \
            libvulkan-dev \
            libx11-dev \
            libxkbcommon-dev \
            ninja-build \
            patchelf \
            pkg-config \
            qml6-module-qt-labs-qmlmodels \
            qml6-module-qt5compat-graphicaleffects \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-shapes \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-window \
            qml6-module-qtwebengine \
            qml6-module-qtwebengine-controlsdelegates \
            qt6-5compat-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-image-formats-plugins \
            qt6-positioning-dev \
            qt6-serialport-dev \
            qt6-shadertools-dev \
            qt6-svg-dev \
            qt6-wayland \
            qt6-wayland-dev \
            qt6-webchannel-dev \
            qt6-webengine-dev \
            qt6-webengine-dev-tools
          apt-get install -y --no-install-recommends \
            -t trixie-backports \
            cmake

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: SteamService/packages.lock.json

      - name: Build renderers and SteamService
        shell: bash
        run: |
          set -euo pipefail
          JOBS="$(nproc)" ./scripts/build_all_linux.sh renderers
          ./scripts/build_steam_service_linux.sh

      - name: Build MirageQt
        shell: bash
        run: |
          set -euo pipefail
          cmake -S MirageQt -B MirageQt/build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build MirageQt/build/release --parallel "$(nproc)"
          test -x MirageQt/build/release/bin/MirageQt

      - name: Stage AppDir
        shell: bash
        run: |
          set -euo pipefail
          appdir="$RUNNER_TEMP/Mirage.AppDir"
          rm -rf "$appdir"
          cmake --install MirageQt/build/release --prefix "$appdir/usr"

          install -Dm755 \
            SceneRenderer/build/linux-clang-release/Tools/SceneWallpaper/SceneWallpaper \
            "$appdir/usr/bin/SceneWallpaper"
          install -Dm755 \
            VideoRenderer/build/release/Tools/VideoWallpaper/VideoWallpaper \
            "$appdir/usr/bin/VideoWallpaper"
          install -Dm755 \
            WebRenderer/build/linux-release/Tools/WebWallpaper/WebWallpaper \
            "$appdir/usr/bin/WebWallpaper"

          # These are the application-owned files. linuxdeploy scans their
          # DT_NEEDED entries and deploys Debian's shared runtime libraries;
          # no separately built FFmpeg/mpv/Vulkan prefix is copied here.
          cp -a assets "$appdir/usr/bin/assets"
          cp -a SceneRenderer/build/linux-clang-release/MirageLinuxDisplay/src/libmirage_display.so* \
            "$appdir/usr/bin/"
          patchelf --set-rpath '$ORIGIN' \
            "$appdir/usr/bin/SceneWallpaper" \
            "$appdir/usr/bin/VideoWallpaper" \
            "$appdir/usr/bin/WebWallpaper"

          install -d "$appdir/usr/bin/SteamService"
          cp -a SteamService/build/linux-x64 \
            "$appdir/usr/bin/SteamService/linux-x64"

          desktop-file-validate "$appdir/usr/share/applications/mirageqt.desktop"
          test -x "$appdir/usr/bin/MirageQt"
          test -x "$appdir/usr/bin/SceneWallpaper"
          test -x "$appdir/usr/bin/VideoWallpaper"
          test -x "$appdir/usr/bin/WebWallpaper"
          test -x "$appdir/usr/bin/SteamService/linux-x64/runtime/dotnet"
          test -f "$appdir/usr/bin/SteamService/linux-x64/app/MirageSteamService.dll"
          test -d "$appdir/usr/bin/assets"

      - name: Download AppImage tooling
        shell: bash
        run: |
          set -euo pipefail
          linuxdeploy_url="https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage"
          qt_plugin_url="https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage"
          appimagetool_url="https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"

          curl --fail --location --retry 3 --silent --show-error \
            "$linuxdeploy_url" -o "$RUNNER_TEMP/linuxdeploy"
          curl --fail --location --retry 3 --silent --show-error \
            "$qt_plugin_url" -o "$RUNNER_TEMP/linuxdeploy-plugin-qt"
          curl --fail --location --retry 3 --silent --show-error \
            "$appimagetool_url" -o "$RUNNER_TEMP/appimagetool"

          printf '%s  %s\n' \
            c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d \
            "$RUNNER_TEMP/linuxdeploy" | sha256sum -c -
          printf '%s  %s\n' \
            ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 \
            "$RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/linuxdeploy" \
            "$RUNNER_TEMP/linuxdeploy-plugin-qt" \
            "$RUNNER_TEMP/appimagetool"

      - name: Build AppImage
        id: package
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          EXTRA_QT_MODULES: "core5compat;shadertools;waylandcompositor"
          EXTRA_PLATFORM_PLUGINS: "libqwayland-egl.so;libqwayland-generic.so"
          QML_SOURCES_PATHS: "${{ github.workspace }}/MirageQt/Sources/Qml"
        run: |
          set -euo pipefail
          appdir="$RUNNER_TEMP/Mirage.AppDir"
          export PATH="$RUNNER_TEMP:$PATH"
          export QMAKE="$(command -v qmake6)"

          linuxdeploy \
            --appdir "$appdir" \
            --executable "$appdir/usr/bin/MirageQt" \
            --executable "$appdir/usr/bin/SceneWallpaper" \
            --executable "$appdir/usr/bin/VideoWallpaper" \
            --executable "$appdir/usr/bin/WebWallpaper" \
            --desktop-file "$appdir/usr/share/applications/mirageqt.desktop" \
            --icon-file "$appdir/usr/share/icons/hicolor/512x512/apps/mirageqt.png" \
            --plugin qt

          # Wayland/EGL/Vulkan loaders are host-owned graphics ABI. Do not mix
          # Debian build-machine loaders with the target machine's NVIDIA/Mesa
          # ICDs; the renderer contract already requires a host Vulkan driver.
          rm -f "$appdir/usr/lib"/libwayland-egl.so.1* \
            "$appdir/usr/lib"/libwayland-cursor.so.0* \
            "$appdir/usr/lib"/libvulkan.so.1*
          test -z "$(find "$appdir/usr/lib" -maxdepth 1 \
            \( -name 'libwayland-egl.so.1*' -o \
               -name 'libwayland-cursor.so.0*' -o \
               -name 'libvulkan.so.1*' \) -print -quit)"

          mkdir -p dist
          package="Mirage-${GITHUB_SHA:0:12}-linux-x86_64.AppImage"
          appimagetool "$appdir" "dist/$package"
          test -x "dist/$package"
          file "dist/$package" | grep -q 'AppImage\|ELF 64-bit'
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Mirage-linux-x86_64-AppImage
          path: dist/${{ steps.package.outputs.package }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
