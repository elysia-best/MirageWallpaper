name: Build Linux dist

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_MULTILEVEL_LOOKUP: "0"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Linux x86_64 dist
    runs-on: ubuntu-24.04
    container:
      image: almalinux:9
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install AlmaLinux 9 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          dnf -y install dnf-plugins-core epel-release ca-certificates file git
          dnf config-manager --set-enabled crb
          dnf -y install \
            https://mirrors.rpmfusion.org/free/el/rpmfusion-free-release-9.noarch.rpm
          dnf -y install \
            gcc-c++ make clang lld dbus-devel fontconfig-devel freetype-devel \
            glslang libass-devel alsa-lib-devel libdrm-devel libglvnd-devel \
            lz4-devel mpv-libs-devel libplacebo6-devel pulseaudio-libs-devel \
            mesa-libEGL-devel mesa-libGLES-devel pipewire-devel \
            vulkan-headers vulkan-loader-devel libX11-devel libxkbcommon-devel \
            libxcb-devel libxkbcommon-x11-devel wayland-devel libinput-devel \
            patchelf unzip pkgconf-pkg-config \
            qt6-qt5compat-devel qt6-qtbase-devel qt6-qtdeclarative-devel \
            qt6-qtquickcontrols2 qt6-qtshadertools-devel qt6-qtsvg-devel \
            qt6-qtwayland qt6-qtwayland-devel qt6-qtwebchannel-devel qt6-qtwebengine-devel \
            ffmpeg-free ffmpeg-free-devel openssl-libs
          curl --fail --location --silent --show-error \
            https://packages.microsoft.com/config/rhel/9/packages-microsoft-prod.rpm \
            -o /tmp/packages-microsoft-prod.rpm
          dnf -y install /tmp/packages-microsoft-prod.rpm
          dnf -y install dotnet-sdk-10.0

          ninja_version='1.13.1'
          mkdir -p /opt/ninja
          curl --fail --location --silent --show-error \
            "https://github.com/ninja-build/ninja/releases/download/v${ninja_version}/ninja-linux.zip" \
            -o /tmp/ninja.zip
          unzip -p /tmp/ninja.zip ninja > /opt/ninja/ninja
          chmod 755 /opt/ninja/ninja
          export PATH="/opt/ninja:$PATH"
          printf '%s\n' /opt/ninja >> "$GITHUB_PATH"
          test "$(ninja --version)" = "$ninja_version"

          cmake_version='4.3.1'
          curl --fail --location --silent --show-error \
            "https://github.com/Kitware/CMake/releases/download/v${cmake_version}/cmake-${cmake_version}-linux-x86_64.tar.gz" \
            -o /tmp/cmake.tar.gz
          tar -xzf /tmp/cmake.tar.gz -C /opt
          ln -s "/opt/cmake-${cmake_version}-linux-x86_64" /opt/cmake
          printf '%s/bin\n' /opt/cmake >> "$GITHUB_PATH"
          /opt/cmake/bin/cmake --version | grep -q "^cmake version ${cmake_version}$"
          {
            printf 'CC=%s\n' "$(command -v clang)"
            printf 'CXX=%s\n' "$(command -v clang++)"
            printf 'FFMPEG_BIN=%s\n' "$(command -v ffmpeg)"
          } >> "$GITHUB_ENV"

      - name: Install linuxdeploy tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/linuxdeploy"
          curl --fail --location --silent --show-error \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -o "$RUNNER_TEMP/linuxdeploy/linuxdeploy"
          curl --fail --location --silent --show-error \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            -o "$RUNNER_TEMP/linuxdeploy/linuxdeploy-plugin-qt"
          chmod 755 "$RUNNER_TEMP/linuxdeploy/linuxdeploy" "$RUNNER_TEMP/linuxdeploy/linuxdeploy-plugin-qt"
          printf '%s\n' "$RUNNER_TEMP/linuxdeploy" >> "$GITHUB_PATH"
          printf 'LINUXDEPLOY=%s\n' "$RUNNER_TEMP/linuxdeploy/linuxdeploy" >> "$GITHUB_ENV"
          printf 'LINUXDEPLOY_PLUGIN_QT=%s\n' "$RUNNER_TEMP/linuxdeploy/linuxdeploy-plugin-qt" >> "$GITHUB_ENV"

      - name: Install appimagetool
        shell: bash
        run: |
          set -euo pipefail
          appimagetool="${RUNNER_TEMP}/appimagetool-x86_64.AppImage"
          curl --fail --location --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o "$appimagetool"
          chmod 755 "$appimagetool"
          printf '%s\n' "$(dirname "$appimagetool")" >> "$GITHUB_PATH"
          printf 'APPIMAGETOOL=%s\n' "$appimagetool" >> "$GITHUB_ENV"

      - name: Build and package Linux distribution
        shell: bash
        run: |
          set -euo pipefail
          JOBS="$(nproc)" scripts/build_all_linux.sh release

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MirageWallpaper-linux-x86_64-AppImage
          path: dist/MirageWallpaper-*-linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
