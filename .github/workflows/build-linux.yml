name: Build Linux AppImage

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CC: clang-21
      CXX: clang++-21
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            desktop-file-utils \
            build-essential \
            file \
            glslang-dev \
            glslang-tools \
            libasound2-dev \
            libass-dev \
            libdbus-1-dev \
            libdrm-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libglfw3-dev \
            libglvnd-dev \
            liblz4-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libsdl2-dev \
            libx11-dev \
            nasm \
            ninja-build \
            patchelf \
            pkg-config \
            python3-jinja2 \
            python3-pip
      - name: Install LunarG Vulkan SDK 1.4.313
        shell: bash
        run: |
          set -euo pipefail
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.4.313-jammy.list \
            https://packages.lunarg.com/vulkan/1.4.313/lunarg-vulkan-1.4.313-jammy.list
          sudo apt update
          sudo apt install -y --no-install-recommends vulkan-sdk
          pkg-config --modversion vulkan
          pkg-config --atleast-version=1.3.277 vulkan

      - name: Install meson
        shell: bash
        run: |
          set -euo pipefail
          # mpv 0.41 的 meson.build 要求 meson >= 1.3.0；ubuntu-22.04 的 apt
          # meson 只有 0.61，且 ninja 已由 apt 提供（1.11，满足 meson 1.3 的
          # ninja >= 1.8.2 要求），因此从 pip 安装新版 meson。
          sudo python3 -m pip install --quiet 'meson>=1.3'
          version="$(meson --version)"
          test "$(printf '%s\n' '1.3' "$version" | sort -V | head -n1)" = "1.3"

      - name: Build FFmpeg 7.1.1
        shell: bash
        run: |
          set -euo pipefail
          version="7.1.1"
          prefix="$RUNNER_TEMP/ffmpeg"
          archive="$RUNNER_TEMP/ffmpeg-${version}.tar.xz"
          source_dir="$RUNNER_TEMP/ffmpeg-${version}"

          curl --fail --location --retry 3 --silent --show-error \
            "https://ffmpeg.org/releases/ffmpeg-${version}.tar.xz" \
            -o "$archive"
          printf '%s  %s\n' \
            733984395e0dbbe5c046abda2dc49a5544e7e0e1e2366bba849222ae9e3a03b1 \
            "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"

          cd "$source_dir"
          CC=gcc CXX=g++ ./configure \
            --prefix="$prefix" \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-static \
            --enable-shared \
            --enable-pic \
            --disable-autodetect \
            --enable-vulkan \
            --enable-libdrm
          make -j"$(nproc)"
          make install

          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          pkg-config --modversion libavformat libavcodec libavutil libswscale libswresample
          test -f "$prefix/lib/pkgconfig/libavutil.pc"

          {
            printf 'FFMPEG_PREFIX=%s\n' "$prefix"
            printf 'PKG_CONFIG_PATH=%s\n' "$PKG_CONFIG_PATH"
            printf 'LD_LIBRARY_PATH=%s/lib:%s\n' "$prefix" "${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"

      - name: Build libplacebo 7.360.1
        shell: bash
        run: |
          set -euo pipefail
          # 此时 clang-21 尚未安装（Select Clang 步骤在其后），meson 会读取
          # job 级 CC/CXX=clang-21；与 FFmpeg 步骤一致，这里显式用 gcc。
          export CC=gcc CXX=g++
          # mpv 0.41 无条件硬依赖 libplacebo>=6.338.2（meson 无禁用开关），而
          # ubuntu-22.04 的 apt libplacebo 只有 4.208.0，因此从源码构建。
          # 仅启用 vulkan 后端：libplacebo 的 opengl 后端依赖 3rdparty/glad
          # submodule（GitHub tarball 不含，会导致构建失败），且 mpv 的 GL
          # render API 走 mpv 自带的 ra_gl（video/out/opengl/ra_gl.c），不经
          # libplacebo 的 opengl 后端，故 -Dopengl=disabled 既满足 mpv 需求
          # 又避开了 glad。glslang 用于编译内置 shader，由 apt glslang-dev
          # 提供库；glsl 预处理脚本需要 python3-jinja2（apt）。
          version="7.360.1"
          prefix="$RUNNER_TEMP/libplacebo"
          archive="$RUNNER_TEMP/libplacebo-${version}.tar.gz"
          source_dir="$RUNNER_TEMP/libplacebo-${version}"

          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/haasn/libplacebo/archive/refs/tags/v${version}.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' \
            d05fdf90bea2f629eaa2d115e909fd356388ac639e54f77b87a018a6d76224bd \
            "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"

          cd "$source_dir"
          meson setup build \
            --prefix="$prefix" \
            -Dvulkan=enabled \
            -Dopengl=disabled \
            -Dglslang=enabled \
            -Dshaderc=disabled \
            -Dlcms=disabled \
            -Ddovi=disabled \
            -Dlibdovi=disabled \
            -Ddemos=false \
            -Dtests=false
          meson compile -C build -j"$(nproc)"
          ninja -C build install

          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          test "$(pkg-config --modversion libplacebo)" = "7.360.1"
          # mpv 的 -Dvulkan=enabled 会检查 libplacebo 的 pl_has_vulkan=1。
          grep -q '^pl_has_vulkan=1$' "$prefix/lib/pkgconfig/libplacebo.pc"

          {
            printf 'LIBPLACEBO_PREFIX=%s\n' "$prefix"
            printf 'PKG_CONFIG_PATH=%s\n' "$PKG_CONFIG_PATH"
            printf 'LD_LIBRARY_PATH=%s/lib:%s\n' "$prefix" "${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"

      - name: Build mpv 0.41.0
        shell: bash
        run: |
          set -euo pipefail
          # 同 libplacebo 步骤：此时 clang-21 未安装，显式用 gcc 编译。
          export CC=gcc CXX=g++
          # ubuntu-22.04 的 apt libmpv 是 1.4.x（pkg-config mpv<2.0），不满足
          # VideoWallpaper 的 mpv>=2.0（libmpv API 版本），因此从源码构建与
          # 本地开发环境一致的 mpv 0.41.0。要点：
          #   -Dlibmpv=true 时 mpv.pc 的 Version 是 libmpv API 版本 2.5.0；
          #   -Dcplayer=false 跳过 mpv 可执行文件，只产 libmpv 共享库；
          #   VideoWallpaper 用 MPV_RENDER_API_TYPE_OPENGL（EGL surfaceless），
          #   需要 gl/egl；hwdec 只可能走 vulkan（自编译 FFmpeg 带
          #   --enable-vulkan，无 vaapi/nvdec），故 -Dvulkan=enabled；
          #   其余可裁剪项全部禁用，避免 apt 环境误探测到非预期依赖。
          version="0.41.0"
          prefix="$RUNNER_TEMP/mpv"
          archive="$RUNNER_TEMP/mpv-${version}.tar.gz"
          source_dir="$RUNNER_TEMP/mpv-${version}"

          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/mpv-player/mpv/archive/refs/tags/v${version}.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' \
            ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209 \
            "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"

          export PKG_CONFIG_PATH="$FFMPEG_PREFIX/lib/pkgconfig:$LIBPLACEBO_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$FFMPEG_PREFIX/lib:$LIBPLACEBO_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

          cd "$source_dir"
          meson setup build \
            --prefix="$prefix" \
            -Dlibmpv=true \
            -Dcplayer=false \
            -Dgl=enabled \
            -Degl=enabled \
            -Dvulkan=enabled \
            -Dpulse=enabled \
            -Dpipewire=enabled \
            -Dalsa=enabled \
            -Dlua=disabled \
            -Djavascript=disabled \
            -Dlibarchive=disabled \
            -Dlibbluray=disabled \
            -Ddvdnav=disabled \
            -Dcdda=disabled \
            -Ddvbin=disabled \
            -Dzimg=disabled \
            -Dlcms2=disabled \
            -Drubberband=disabled \
            -Duchardet=disabled \
            -Dvapoursynth=disabled \
            -Dwayland=disabled \
            -Dx11=disabled \
            -Ddrm=disabled \
            -Dvaapi=disabled \
            -Dvdpau=disabled \
            -Dcuda-hwaccel=disabled \
            -Dcuda-interop=disabled \
            -Djack=disabled \
            -Dopenal=disabled \
            -Doss-audio=disabled \
            -Dsndio=disabled \
            -Dsdl2-audio=disabled \
            -Dsdl2-video=disabled \
            -Dshaderc=disabled \
            -Dspirv-cross=disabled \
            -Dcaca=disabled \
            -Dsixel=disabled \
            -Dxv=disabled \
            -Dgbm=disabled \
            -Degl-wayland=disabled \
            -Degl-x11=disabled \
            -Degl-drm=disabled \
            -Dx11-clipboard=disabled \
            -Djpeg=disabled \
            -Dlibavdevice=disabled
          meson compile -C build -j"$(nproc)"
          ninja -C build install

          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LD_LIBRARY_PATH="$prefix/lib:$LD_LIBRARY_PATH"
          test "$(pkg-config --modversion mpv)" = "2.5.0"
          pkg-config --atleast-version=2.0 mpv
          test -f "$prefix/lib/libmpv.so.2"
          test -f "$prefix/include/mpv/render_gl.h"

          {
            printf 'MPV_PREFIX=%s\n' "$prefix"
            printf 'PKG_CONFIG_PATH=%s\n' "$PKG_CONFIG_PATH"
            printf 'LD_LIBRARY_PATH=%s\n' "$LD_LIBRARY_PATH"
          } >> "$GITHUB_ENV"

      - name: Set up CMake 4.3.4
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2
        with:
          cmake-version: 4.3.4

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: '==3.3.*'
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          # FluentUI imports Qt5Compat.GraphicalEffects; Positioning's NMEA
          # plugin links Qt6SerialPort. Qt's SDK exposes the Wayland client
          # runtime under the qtwaylandcompositor package group.
          modules: 'qt5compat qtpositioning qtserialport qtshadertools qtwaylandcompositor qtwebchannel qtwebengine'
      
      - name: Set up Clang 21
        uses: egor-tensin/setup-clang@23bc15cd4207e45f1566447deb48f4ff3ef932cb # v2
        with:
          version: 21
          platform: x64
          # v2 has historically created the generic links itself; create the
          # links below explicitly so the CMake presets always select Clang 21.
          cc: 0

      - name: Select Clang 21
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends clang-21
          command -v clang-21
          command -v clang++-21
          sudo ln -sfn "$(command -v clang-21)" /usr/local/bin/clang
          sudo ln -sfn "$(command -v clang++-21)" /usr/local/bin/clang++
          sudo ln -sfn "$(command -v clang-21)" /usr/local/bin/cc
          sudo ln -sfn "$(command -v clang++-21)" /usr/local/bin/c++
          clang --version
          clang++ --version

      - name: Build Linux renderers
        shell: bash
        run: |
          set -euo pipefail
          # 自编译的 FFmpeg、libplacebo、mpv 都装在 RUNNER_TEMP 下各自的
          # prefix，pkg-config 与动态链接都依赖显式路径（不在系统默认搜索
          # 路径内）。mpv.pc 的 Version 为 libmpv API 版本 2.5.0。
          export PKG_CONFIG_PATH="$MPV_PREFIX/lib/pkgconfig:$LIBPLACEBO_PREFIX/lib/pkgconfig:$FFMPEG_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$MPV_PREFIX/lib:$LIBPLACEBO_PREFIX/lib:$FFMPEG_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          test "$(pkg-config --variable=prefix libavformat)" = "$FFMPEG_PREFIX"
          pkg-config --atleast-version=61 libavformat
          pkg-config --atleast-version=2.0 mpv
          test "$(pkg-config --modversion mpv)" = "2.5.0"
          pkg-config --modversion libavformat libavcodec libavutil libswscale libswresample
          JOBS="$(nproc)" ./scripts/build_all_linux.sh renderers

      - name: Build and install MirageQt
        shell: bash
        run: |
          set -euo pipefail
          cmake -S MirageQt -B MirageQt/build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX"
          cmake --build MirageQt/build/release --parallel "$(nproc)"

      - name: Stage AppDir
        shell: bash
        run: |
          set -euo pipefail
          appdir="$RUNNER_TEMP/Mirage.AppDir"
          rm -rf "$appdir"
          cmake --install MirageQt/build/release --prefix "$appdir/usr"

          install -Dm755 \
            SceneRenderer/build/linux-clang-release/Tools/SceneWallpaper/SceneWallpaper \
            "$appdir/usr/bin/SceneWallpaper"
          install -Dm755 \
            VideoRenderer/build/release/Tools/VideoWallpaper/VideoWallpaper \
            "$appdir/usr/bin/VideoWallpaper"
          cp -a "$FFMPEG_PREFIX"/lib/libav*.so* "$appdir/usr/bin/"
          cp -a "$FFMPEG_PREFIX"/lib/libsw*.so* "$appdir/usr/bin/"
          # libmpv 及其硬依赖 libplacebo（自编译）和 libass（apt 系统库）随
          # 渲染器一起打包进 AppDir/usr/bin：VideoWallpaper 的 RUNPATH 会被
          # patchelf 改为 $ORIGIN，ld 从同一目录解析 libmpv 及其 DT_NEEDED。
          cp -a "$MPV_PREFIX"/lib/libmpv.so* "$appdir/usr/bin/"
          cp -a "$LIBPLACEBO_PREFIX"/lib/libplacebo.so* "$appdir/usr/bin/"
          cp -a /usr/lib/x86_64-linux-gnu/libass.so* "$appdir/usr/bin/"
          cp -a assets "$appdir/usr/bin/assets"

          cp -a SceneRenderer/build/linux-clang-release/MirageLinuxDisplay/src/libmirage_display.so* \
            "$appdir/usr/bin/"
          patchelf --set-rpath '$ORIGIN' \
            "$appdir/usr/bin/SceneWallpaper" \
            "$appdir/usr/bin/VideoWallpaper"

          desktop-file-validate "$appdir/usr/share/applications/mirageqt.desktop"
          test -x "$appdir/usr/bin/MirageQt"
          test -x "$appdir/usr/bin/SceneWallpaper"
          test -x "$appdir/usr/bin/VideoWallpaper"
          test -d "$appdir/usr/bin/assets"
          test -f "$appdir/usr/bin/libmpv.so.2"
          test -f "$appdir/usr/bin/libplacebo.so.360"
          test -f "$appdir/usr/bin/libass.so.9"
      - name: Download AppImage tooling
        shell: bash
        run: |
          set -euo pipefail
          linuxdeploy_url="https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage"
          qt_plugin_url="https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage"
          appimagetool_url="https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"

          curl --fail --location --retry 3 --silent --show-error \
            "$linuxdeploy_url" -o "$RUNNER_TEMP/linuxdeploy"
          curl --fail --location --retry 3 --silent --show-error \
            "$qt_plugin_url" -o "$RUNNER_TEMP/linuxdeploy-plugin-qt"
          curl --fail --location --retry 3 --silent --show-error \
            "$appimagetool_url" -o "$RUNNER_TEMP/appimagetool"

          printf '%s  %s\n' \
            c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d \
            "$RUNNER_TEMP/linuxdeploy" | sha256sum -c -
          printf '%s  %s\n' \
            ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 \
            "$RUNNER_TEMP/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/linuxdeploy" \
            "$RUNNER_TEMP/linuxdeploy-plugin-qt" \
            "$RUNNER_TEMP/appimagetool"

      - name: Build AppImage
        id: package
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # linuxdeploy uses this deployer name for the client-side shell and
          # graphics integration plugins; no compositor library is deployed.
          EXTRA_QT_MODULES: "core5compat;shadertools;waylandcompositor"
          EXTRA_PLATFORM_PLUGINS: "libqwayland-egl.so;libqwayland-generic.so"
        run: |
          set -euo pipefail
          appdir="$RUNNER_TEMP/Mirage.AppDir"
          export PATH="$RUNNER_TEMP:$PATH"
          qmake_bin="$(command -v qmake6 || command -v qmake)"
          export QMAKE="$qmake_bin"

          linuxdeploy \
            --appdir "$appdir" \
            --library "$QT_ROOT_DIR/lib/libQt6Core5Compat.so.6" \
            --library "$QT_ROOT_DIR/lib/libQt6ShaderTools.so.6" \
            --executable "$appdir/usr/bin/MirageQt" \
            --executable "$appdir/usr/bin/SceneWallpaper" \
            --executable "$appdir/usr/bin/VideoWallpaper" \
            --desktop-file "$appdir/usr/share/applications/mirageqt.desktop" \
            --icon-file "$appdir/usr/share/icons/hicolor/512x512/apps/mirageqt.png" \
            --plugin qt

          test -f "$appdir/usr/lib/libQt6WaylandClient.so.6"
          test -f "$appdir/usr/lib/libQt6WaylandEglClientHwIntegration.so.6"
          test -f "$appdir/usr/lib/libQt6Core5Compat.so.6"
          test -f "$appdir/usr/lib/libQt6ShaderTools.so.6"
          test -f "$appdir/usr/plugins/platforms/libqwayland-generic.so"
          test -f "$appdir/usr/plugins/platforms/libqwayland-egl.so"
          test -f "$appdir/usr/plugins/wayland-shell-integration/libxdg-shell.so"
          test -f "$appdir/usr/plugins/wayland-shell-integration/libwl-shell-plugin.so"
          test -f "$appdir/usr/plugins/wayland-shell-integration/libivi-shell.so"
          test -f "$appdir/usr/plugins/wayland-shell-integration/libqt-shell.so"
          test -f "$appdir/usr/qml/Qt5Compat/GraphicalEffects/libqtgraphicaleffectsplugin.so"

          mkdir -p dist
          package="Mirage-${GITHUB_SHA:0:12}-linux-x86_64.AppImage"
          appimagetool "$appdir" "dist/$package"
          test -x "dist/$package"
          file "dist/$package" | grep -q 'AppImage\|ELF 64-bit'
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Mirage-linux-x86_64-AppImage
          path: dist/${{ steps.package.outputs.package }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
