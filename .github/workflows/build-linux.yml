name: Build Linux dist

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_MULTILEVEL_LOOKUP: "0"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Linux x86_64 dist
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        shell: bash
        run: |
          set -euo pipefail
          if command -v brew >/dev/null 2>&1; then
            brew_bin="$(command -v brew)"
          else
            NONINTERACTIVE=1 /bin/bash -c "$(curl --fail --location --silent --show-error https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            brew_bin="/home/linuxbrew/.linuxbrew/bin/brew"
          fi
          eval "$("$brew_bin" shellenv)"
          test "$(uname -s)" = Linux
          printf '%s\n' "$HOMEBREW_PREFIX/bin" "$HOMEBREW_PREFIX/sbin" >> "$GITHUB_PATH"
          printf 'HOMEBREW_PREFIX=%s\n' "$HOMEBREW_PREFIX" >> "$GITHUB_ENV"

      - name: Install build dependencies with Homebrew
        shell: bash
        run: |
          set -euo pipefail
          brew install alsa-lib cmake dbus dotnet ffmpeg fontconfig freetype glslang glfw \
            libass libdrm libplacebo libx11 libxkbcommon llvm lld lz4 mesa mpv ninja \
            patchelf pipewire pkgconf pulseaudio qt qtwebengine vulkan-headers vulkan-loader
          brew_prefix="$(brew --prefix)"
          llvm_prefix="$(brew --prefix llvm)"
          lld_prefix="$(brew --prefix lld)"
          dotnet_prefix="$(brew --prefix dotnet)"
          printf '%s\n' "$llvm_prefix/bin" "$lld_prefix/bin" >> "$GITHUB_PATH"
          {
            printf 'CC=%s\n' "$llvm_prefix/bin/clang"
            printf 'CXX=%s\n' "$llvm_prefix/bin/clang++"
            printf 'CMAKE_PREFIX_PATH=%s\n' "$brew_prefix"
            printf 'DOTNET_ROOT=%s/libexec\n' "$dotnet_prefix"
            printf 'PKG_CONFIG_PATH=%s/lib/pkgconfig:%s/share/pkgconfig\n' "$brew_prefix" "$brew_prefix"
            printf 'QT_PREFIX=%s\n' "$(brew --prefix qt)"
            printf 'FFMPEG_BIN=%s\n' "$brew_prefix/bin/ffmpeg"
          } >> "$GITHUB_ENV"
          dotnet --version | grep -Eq '^10\.'
          cmake --version
          clang++ --version | head -1

      - name: Build and package Linux distribution
        shell: bash
        run: |
          set -euo pipefail
          JOBS="$(nproc)" scripts/build_all_linux.sh release

      - name: Upload Linux dist archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MirageWallpaper-linux-x86_64-dist
          path: dist/MirageWallpaper-*-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
